<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Green Paprika</title>
  <link rel="icon" type="image/svg+xml" href="/green-paprika/pepper.svg">
  <link rel="apple-touch-icon" href="/green-paprika/pepper.svg">
  <style>
    :root {
      color-scheme: light;
      --gp-paper: #f7e9d5;
      --gp-card: rgba(255, 252, 247, 0.9);
      --gp-ink: #2f2417;
      --gp-muted: #695844;
      --gp-accent: #7e2e24;
      --gp-accent-green: #075200;
      --gp-accent-soft: #ead6c3;
      --gp-line: rgba(47, 36, 23, 0.14);
      --gp-shadow: 0 24px 48px rgba(66, 39, 19, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(255, 255, 255, 0.4), transparent 28%),
        linear-gradient(180deg, #f8eddc 0%, var(--gp-paper) 100%);
      color: var(--gp-ink);
      font-family: Georgia, "Times New Roman", serif;
    }

    a {
      color: inherit;
    }

    .gp-shell {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 24px 0 34px;
    }

    .gp-layout {
      display: grid;
      grid-template-columns: minmax(280px, 0.85fr) minmax(0, 1.15fr);
      gap: 18px;
      align-items: start;
    }

    .gp-copy,
    .gp-panel {
      padding: 24px;
      border: 1px solid var(--gp-line);
      border-radius: 18px;
      background: var(--gp-card);
      box-shadow: var(--gp-shadow);
    }

    .gp-left-column {
      display: grid;
      gap: 18px;
    }

    .gp-flyer-panel {
      padding: 10px;
      border: 1px solid var(--gp-line);
      border-radius: 18px;
      background: var(--gp-card);
      box-shadow: var(--gp-shadow);
    }

    .gp-content-panel {
      padding: 26px;
    }

    .gp-kicker {
      margin: 0 0 8px;
      color: var(--gp-accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1,
    h2,
    p,
    ul {
      margin-top: 0;
    }

    h1 {
      margin-bottom: 10px;
      font-size: clamp(2rem, 4.8vw, 3.6rem);
      line-height: 1;
      max-width: 9ch;
    }

    h2 {
      margin-bottom: 10px;
      font-size: 1.2rem;
    }

    .gp-lede {
      max-width: 60ch;
      margin-bottom: 18px;
      color: var(--gp-muted);
      line-height: 1.5;
    }

    .gp-details {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 16px;
      padding: 12px;
      border: 1px solid rgba(68, 107, 51, 0.55);
      border-radius: 12px;
    }

    .gp-detail-card {
      padding: 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.68);
      border: 1px solid rgba(126, 46, 36, 0.1);
    }

    .gp-detail-label {
      display: block;
      margin-bottom: 4px;
      color: var(--gp-muted);
      font-size: 0.72rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .gp-detail-value {
      display: block;
      font-size: 0.95rem;
      line-height: 1.3;
    }

    .gp-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .gp-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 40px;
      padding: 0 14px;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 700;
      font-size: 0.95rem;
    }

    .gp-button-primary {
      background: var(--gp-accent);
      color: #fff8f3;
    }

    .gp-button-secondary {
      border: 1px solid rgba(126, 46, 36, 0.2);
      background: var(--gp-accent-soft);
      color: var(--gp-ink);
    }

    .gp-note,
    .gp-body-copy {
      color: var(--gp-muted);
      line-height: 1.5;
    }

    .gp-note {
      margin-bottom: 18px;
    }

    .gp-flyer {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 16px;
    }

    .gp-content-block + .gp-content-block {
      margin-top: 18px;
    }

    .gp-section-label {
      margin-bottom: 6px;
      color: var(--gp-accent);
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .gp-center {
      text-align: center;
      color: var(--gp-accent-green);
    }

    .gp-menu-list {
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .gp-menu-list li + li {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--gp-line);
    }

    .gp-menu-list strong {
      display: block;
      margin-bottom: 3px;
      color: var(--gp-accent);
      font-size: 0.98rem;
    }

    .gp-menu-list span {
      color: var(--gp-muted);
      line-height: 1.45;
    }

    .gp-inline-link {
      color: var(--gp-accent);
    }

    .gp-inline-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
      padding: 2px 10px;
      border: 1px solid rgba(126, 46, 36, 0.22);
      border-radius: 999px;
      background: var(--gp-accent-soft);
      color: var(--gp-ink);
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 700;
      white-space: nowrap;
      vertical-align: baseline;
    }

    .gp-contact-panel h2 {
      margin-bottom: 12px;
    }

    .gp-form label {
      display: block;
      margin-bottom: 3px;
      font-size: 0.94rem;
    }

    .gp-form input,
    .gp-form textarea,
    .gp-submit {
      font: inherit;
    }

    .gp-form input,
    .gp-form textarea {
      width: 100%;
      box-sizing: border-box;
      margin-bottom: 8px;
      border: 1px solid #8e8578;
      background: #fff;
      padding: 5px 7px;
      color: var(--gp-ink);
    }

    .gp-form textarea {
      min-height: 96px;
      resize: vertical;
    }

    .gp-form-actions {
      text-align: center;
    }

    .gp-submit {
      display: inline-block;
      padding: 4px 10px;
      background: #f4f4f4;
      border: 1px solid #777;
      color: #000;
      cursor: pointer;
    }

    @media (max-width: 860px) {
      .gp-shell {
        width: min(100% - 20px, 1100px);
        padding: 16px 0 24px;
      }

      .gp-layout {
        grid-template-columns: 1fr;
      }

      .gp-details {
        grid-template-columns: 1fr;
      }

      .gp-copy,
      .gp-panel,
      .gp-content-panel {
        padding: 18px;
      }

      .gp-flyer-panel {
        padding: 8px;
      }

      h1 {
        max-width: none;
        font-size: clamp(1.8rem, 8vw, 2.6rem);
      }

      .gp-button {
        width: 100%;
      }
    }

    @media (max-width: 520px) {
      .gp-details {
        padding: 10px;
      }

      .gp-detail-card {
        padding: 10px;
      }

      .gp-note,
      .gp-body-copy,
      .gp-menu-list span {
        font-size: 0.96rem;
      }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module">
    import React from 'https://esm.sh/react@18.2.0';
    import ReactDOM from 'https://esm.sh/react-dom@18.2.0/client';
    import { GreenPaprikaJVSEvent } from '/green-paprika/jvs_event_files/jvs-event.js';

    ReactDOM.createRoot(document.getElementById('root')).render(
      React.createElement(GreenPaprikaJVSEvent),
    );
  </script>
</body>
</html>
