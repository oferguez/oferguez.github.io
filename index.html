      function gtag(){dataLayer.push(arguments);}

    <script>
      const params = new URLSearchParams(window.location.search);
      const devParam = params.get('dev_visit');

      if (devParam === 'true') {
        gtag('set', { user_properties: { dev_visit: 'true' }});
      } else if (devParam === 'false') {
        gtag('set', { user_properties: { dev_visit: 'false' }});
      } else {
        gtag('set', { user_properties: { dev_visit: 'none' }});
