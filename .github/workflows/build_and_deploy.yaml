name: Deploy to GitHub Pages

on:
  push:
    branches: Publish
  pull_request:
    branches: Publish
  workflow_dispatch:
    branches: Publish

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: 
  group: pages
  cancel-in-progress: true

jobs:
  diagnostics:
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/Publish')
            || (github.event_name == 'pull_request' && github.base_ref == 'Publish')
            || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/Publish') }}  
    runs-on: ubuntu-latest
    steps:
      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJSON(github) }}
        run: echo "$GITHUB_CONTEXT"

  build:  
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V4
        uses: actions/checkout@v4
      - name: Setup
        uses: actions/setup-node@v4
        with: 
          node-version: latest
          cache: npm
      - run: npm ci
      - run: npm run build          # produces ./dist
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v4
        with: 
          path: dist

  deploy:
    if: github.ref == 'refs/heads/Publish'
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment




